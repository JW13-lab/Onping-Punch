<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>치즈 때리기</title>
<style>
:root{--bg:#fff7e0;--card:#ffffff;--text:#3b2f1a;--sub:#8a7650;--line:#f0dca0;--accent:#f5b800;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a12;--card:#2b261a;--text:#f5ecd2;--sub:#b8a778;--line:#4a4128}}
:root[data-theme="dark"]{--bg:#1e1a12;--card:#2b261a;--text:#f5ecd2;--sub:#b8a778;--line:#4a4128}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;user-select:none;-webkit-user-select:none}
.wrap{max-width:980px;margin:0 auto;padding:16px;display:flex;flex-wrap:wrap;gap:16px}
.left{flex:1 1 340px;text-align:center}
.right{flex:1 1 320px}
h1{margin:0 0 6px;font-size:22px}
.cheese{font-size:34px;font-weight:800;color:var(--accent)}
.stats{color:var(--sub);font-size:14px;margin-bottom:8px}
.stage{position:relative;width:300px;height:300px;max-width:100%;margin:0 auto;cursor:pointer;touch-action:manipulation}
.stage .box{width:100%;height:100%}
.stage .box.shake{animation:shake .15s}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-9px,3px) rotate(-3deg)}75%{transform:translate(9px,-3px) rotate(3deg)}100%{transform:translate(0,0)}}
.acc{position:absolute;font-size:44px;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.float{position:absolute;pointer-events:none;font-weight:800;font-size:20px;color:var(--accent);text-shadow:0 1px 2px rgba(0,0,0,.4);animation:up .9s ease-out forwards;white-space:nowrap}
@keyframes up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-90px)}}
.hint{color:var(--sub);font-size:13px;margin-top:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.item .ic{font-size:30px;width:40px;text-align:center}
.item .info{flex:1;font-size:13px;color:var(--sub)}
.item .info b{display:block;font-size:15px;color:var(--text)}
.item button{border:0;border-radius:10px;padding:8px 12px;font-weight:700;background:var(--accent);color:#3b2f1a;cursor:pointer;font-family:inherit}
.item button:disabled{opacity:.4;cursor:not-allowed}
.item.own{opacity:.6}
.reset{margin-top:10px;background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:6px 10px;cursor:pointer;font-family:inherit}
.cameo{position:absolute;width:100px;height:100px;object-fit:cover;border-radius:16px;border:3px solid #fff;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.35);pointer-events:none;z-index:5;animation:cameo 1.5s ease-out forwards}
@keyframes cameo{0%{transform:scale(0) rotate(var(--r));opacity:0}15%{transform:scale(1.18) rotate(var(--r));opacity:1}28%{transform:scale(1) rotate(var(--r))}85%{opacity:1}100%{transform:scale(1) rotate(var(--r));opacity:0}}
.tw{animation:tw .7s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}
.stage .box{position:relative}
.pic{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:26px;background:#fff;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.35);transform-origin:50% 100%;transition:transform .1s}
.pic img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ov.top{z-index:4}
.closeup{position:absolute;left:6%;top:6%;width:88%;height:88%;border-radius:50%;border:4px solid #fff;object-fit:cover;z-index:3;box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none}
.badge{position:absolute;left:-10px;top:-10px;width:86px;height:86px;border-radius:50%;border:4px solid #fff;object-fit:cover;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.4);pointer-events:none;animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
</style>
</head>

<script>
// ====== 여기서 장식구를 수정할 수 있어요 ======
// price: 가격(치즈), dmg: 때릴 때 데미지 증가, cheese: 한 번 때릴 때 얻는 치즈 증가
// x, y: 얼굴 위 위치(%)
var ITEMS = [
  {id:"cat",   icon:"🐱", name:"고양이 귀 머리띠", price:300,    dmg:1,   cheese:1,    x:50, y:4},
  {id:"glass", icon:"👓", name:"빨간 안경",       price:1000,   dmg:2,   cheese:3,    x:50, y:44},
  {id:"tteok", icon:"🌶️", name:"엽기떡볶이",      price:1750,   dmg:4,   cheese:8,    x:14, y:80},
  {id:"makeup",icon:"💄", name:"화장품",         price:3500,   dmg:8,   cheese:20,   x:78, y:72},
  {id:"botox", icon:"💉", name:"보톡스",         price:15000,  dmg:15,  cheese:50,   x:90, y:30},
  {id:"lip",   icon:"👄", name:"입술필러",       price:25000,  dmg:30,  cheese:130,  x:50, y:76},
  {id:"bape",  icon:"🦍", name:"베이프",         price:45000,  dmg:60,  cheese:350,  x:12, y:20},
  {id:"chrome",icon:"🖤", name:"크롬하츠",       price:60000,  dmg:150, cheese:1000, x:12, y:58},
  {id:"phone", icon:"📱", name:"갤럭시 최신폰",   price:180000, dmg:400, cheese:3000, x:88, y:90}
];
// ============================================
var KEY="cheeseClickerSave1";
var S={cheese:0,owned:{}};
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw);}catch(e){}
var swell=0, hurt=false, hurtTimer=null;
var $=function(id){return document.getElementById(id)};
function fmt(n){return Math.floor(n).toLocaleString("ko-KR")}
function dmg(){var d=1;ITEMS.forEach(function(i){if(S.owned[i.id])d+=i.dmg});return d}
function perHit(){var c=1;ITEMS.forEach(function(i){if(S.owned[i.id])c+=i.cheese});return c}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function renderShop(){
  var h="";
  ITEMS.forEach(function(i){
    var own=S.owned[i.id];
    h+='<div class="item'+(own?' own':'')+'"><div class="ic">'+i.icon+'</div><div class="info"><b>'+i.name+'</b>데미지 +'+fmt(i.dmg)+' · 치즈 +'+fmt(i.cheese)+'</div>'+
       '<button data-id="'+i.id+'" '+((own||S.cheese<i.price)?'disabled':'')+'>'+(own?'보유중':'🧀 '+fmt(i.price))+'</button></div>';
  });
  $("shop").innerHTML=h;
}
function renderTop(){
  $("cheese").textContent="🧀 "+fmt(S.cheese);
  $("stats").textContent="데미지 "+fmt(dmg())+" · 한 대 때릴 때 치즈 +"+fmt(perHit());

var hitN=0, cameoOn=false;
function maybeCameo(){
  hitN++;
  if(cameoOn)return;
  if(!(hitN%40===0||Math.random()<0.035))return;
  cameoOn=true;
  var im=document.createElement("img");im.className="cameo";
  im.src=CAMEOS[Math.floor(Math.random()*CAMEOS.length)];
  var spots=[[-10,-10],[210,-10],[-10,210],[210,210]];
  var p=spots[Math.floor(Math.random()*4)];
  im.style.left=p[0]+"px";im.style.top=p[1]+"px";
  im.style.setProperty("--r",(Math.random()*30-15)+"deg");
  $("stage").appendChild(im);
  setTimeout(function(){im.remove();cameoOn=false},1500);
}
function pick(){
  if(hurt)return "hit";
  if(happy)return "happy";
  if(swell>=0.97)return "dazed";
  if(swell>=0.7)return "cry";
  if(swell>=0.35)return "swollen";
  return "idle";
}
function renderFace(){
  var k=pick(), s=swell;
  $("pic").style.transform="scale("+(1+s*0.14)+","+(1+s*0.04)+")";
  var f="";
  if(k==="hit")f="brightness(1.05) saturate(1.3)";
  else if(k==="dazed")f="grayscale(.4) brightness(.9)";
  else if(s>=0.35)f="saturate("+(1+s*0.35)+") contrast(1.05)";
  $("pic").style.filter=f;
  $("main").style.display=(k==="hit"||k==="dazed")?"none":"";
  $("imgHit").style.display=(k==="hit")?"":"none";
  $("imgDazed").style.display=(k==="dazed")?"":"none";
  $("badge").style.display=(k==="happy")?"":"none";
  $("g_flash").style.display=(k==="hit")?"":"none";
  $("g_bruise").setAttribute("opacity",Math.max(0,Math.min(1,(s-0.3)*1.4)));
  $("g_aid").style.display=(s>=0.35)?"":"none";
  $("g_tears").style.display=(s>=0.7&&k!=="hit"&&k!=="dazed"&&k!=="happy")?"":"none";
  ["hit","dazed","happy"].forEach(function(n){$("x_"+n).style.display=(n===k)?"":"none"});
}
function hit(e){
  S.cheese+=perHit();
  swell=Math.min(1,swell+0.06+Math.min(dmg(),500)/20000);
  hurt=true;clearTimeout(hurtTimer);hurtTimer=setTimeout(function(){hurt=false;renderFace()},180);
  var st=$("stage"),bx=$("box");bx.classList.remove("shake");void bx.offsetWidth;bx.classList.add("shake");
  var r=st.getBoundingClientRect();
  var f=document.createElement("div");f.className="float";f.textContent="🧀 +"+fmt(perHit());
  f.style.left=(e.clientX-r.left)+"px";f.style.top=(e.clientY-r.top-10)+"px";
  st.appendChild(f);setTimeout(function(){f.remove()},900);
  renderTop();renderFace();save();maybeCameo();
  // 상점 버튼 활성화 갱신
  document.querySelectorAll("#shop button").forEach(function(b){
    var it=ITEMS.filter(function(i){return i.id===b.dataset.id})[0];
    if(!S.owned[it.id])b.disabled=S.cheese<it.price;
  });
}
$("stage").addEventListener("pointerdown",hit);
$("shop").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||b.disabled)return;
  var it=ITEMS.filter(function(i){return i.id===b.dataset.id})[0];
  if(S.cheese>=it.price&&!S.owned[it.id]){S.cheese-=it.price;S.owned[it.id]=true;save();happy=true;clearTimeout(happyTimer);happyTimer=setTimeout(function(){happy=false;renderFace()},1500);renderAll();}
});
$("reset").addEventListener("click",function(){
  if(confirm("정말 처음부터 다시 할까요?")){S={cheese:0,owned:{}};swell=0;save();renderAll();}
});
setInterval(function(){if(swell>0){swell=Math.max(0,swell-0.012);renderFace();}},120);
function renderAll(){renderTop();renderShop();renderFace();}
renderAll();
</script>
